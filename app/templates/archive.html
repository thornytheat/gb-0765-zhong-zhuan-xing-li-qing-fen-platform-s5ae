<div class="panel-head"><h2>批次留档复跑</h2>{% if manifest %}<button id="rerun" data-run="{{ manifest.id }}">复算本批</button>{% endif %}</div>
{% if archive %}<div class="table-scroll"><table><thead><tr><th>归档号</th><th>生成时间 UTC</th><th>计算耗时 μs</th></tr></thead><tbody>{% for run in archive %}<tr><td><a href="{{ url_for('desk.desk', key='archive', run=run.id, sample=selected) }}" title="{{ run.id }}">{{ run.id[:16] }}</a></td><td>{{ run.generated_at[:19] }}</td><td class="num">{{ run.elapsed_us }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p class="empty">选择原件后归档。</p>{% endif %}
